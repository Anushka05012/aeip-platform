name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  intelligence:
    name: Intelligence service (Python)
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/llm-service
    env:
      AEIP_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/llm-service/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: frontend
      - run: npx eslint src
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Session and role tests
        run: npx tsx --test frontend/src/lib/auth/session.test.ts

  ingestion:
    name: Ingestion service (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsx --test ingestion/signature.test.ts
